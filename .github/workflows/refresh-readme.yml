name: Refresh profile README

# Rebuilds the projects, activity, writing and repository sections of README.md
# from nihalsulaiman.com's content files and the GitHub API. Public repo, so no
# Actions minutes are billed. Commits only when something changed.
on:
  schedule:
    - cron: "17 10 * * *"   # every day, 10:17 UTC (early morning in Ontario)
  push:
    branches: [main]
    paths: ["README.md", "repos.json", "scripts/build_readme.py", ".github/workflows/refresh-readme.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check out nihalsulaiman.com content
        uses: actions/checkout@v4
        with:
          repository: nihalunfc/nihalunfc.github.io
          path: site
          sparse-checkout: src/content
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - run: python scripts/build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DIR: site
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile from GitHub and nihalsulaiman.com" -- README.md
          git push
